name: check-html

# Guards index.html against a silent failure mode in the Design Component
# runtime: a comment that names a runtime tag in angle brackets can be parsed
# as real markup and wipe the rendered page, with no console error.
# See scripts/check-html.mjs for the mechanism.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check-html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-html.mjs
